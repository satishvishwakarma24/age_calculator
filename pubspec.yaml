name: age_calculator
description: A cosmic-themed Flutter app for exploring age in multiple ways.
publish_to: 'none'
version: 1.0.1+21
# 21 (1.0.1) deployed on playstore
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  # firebase_core: ^3.6.0
  # firebase_analytics: ^11.3.3
  # firebase_messaging: ^15.1.3
  # firebase_crashlytics: ^4.1.3

  # Ads
  google_mobile_ads: ^5.1.0

  # In-App Purchase
  # in_app_purchase: ^3.2.0

  # Push (choose ONE)
  # onesignal_flutter: ^5.2.6

  # In-App Review
  # in_app_review: ^2.0.9

  # State Management
  provider: ^6.1.2

  # Localization
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.3.2

  # Network / Utils
  # connectivity_plus: ^6.0.5
  # package_info_plus: ^8.1.0
  # url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.7
  animations: ^2.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  sizer: ^3.1.3
  flutter_sizer: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Dev tools
  flutter_launcher_icons: ^0.14.1
  change_app_package_name: ^1.5.0
  rename: ^3.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/planets/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app-icon-512.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app-icon-512.png"